<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Mockups Iniciales PWM</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta charset="utf-8" />
    <meta property="twitter:card" content="summary_large_image" />

    <link rel="stylesheet" data-tag="reset-style-sheet" href="../stylesheets/reset-style-sheet.css"  />
    <link rel="stylesheet" data-tag="default-style-sheet" href="../stylesheets/default-style-sheet.css" />
    <link rel="stylesheet" href="../stylesheets/animate-sheet.css"/>
    <link rel="stylesheet" href="../stylesheets/noto-sans-font.css" data-tag="font"/>
    <link rel="stylesheet" href="../stylesheets/STIX-two-text-font.css" data-tag="font"/>
    <link rel="stylesheet" href="../stylesheets/Inter-font.css" data-tag="font"/>
    <link rel="stylesheet" href="../stylesheets/style.css" />

    <link rel="stylesheet" href="../navigation-bar/navbar.css" />
    <link href="profile.css" rel="stylesheet" />
    <link href="../footer/footer.css" rel="stylesheet" />
    <script src="../script-load-component/js/xlu-include-file.js"></script>
  </head>
  <body>

  <nav class="navbar-wrapper" id="navbar2" xlu-include-file="../navigation-bar/navbar.html">
  </nav>

    <div class="section-padding">
      <div class="profile-max-width section-max-width">
        <div class="profile-intro flex-column">
          <span id="profile-title" class="heading-2">Profile</span>
          <div class="profile-image">
            <img
              alt="Sign Up Image"
              src="https://images.unsplash.com/photo-1708388064322-c15cca1f86a7?crop=entropy&amp;cs=tinysrgb&amp;fit=max&amp;fm=jpg&amp;ixid=M3w5MTMyMXwwfDF8cmFuZG9tfHx8fHx8fHx8MTczOTIxODg1OXw&amp;ixlib=rb-4.0.3&amp;q=80&amp;w=1400"
              class="img-ratio-4-6"
            />
          </div>
        </div>
        <div class="profile-form-root flex-column">
          <div class="flex-column">
            <span class="heading-3">Change your information</span>
            <form class="profile-form flex-column">
              <div class="flex-column">
                <span data-form="thq-sign-up-2-username" class=" text-body-large">Username</span>
                <input
                  type="text"
                  id="thq-sign-up-2-username1"
                  required="required"
                  placeholder="Mr. Lorem Ipsum"
                  class=" text-input text-body-large"/>
                <label for="thq-sign-up-2-username1"></label>
              </div>
              <div class="flex-column">
                <span data-form="thq-sign-up-2-email" class=" text-body-large">Email</span>
                <input
                  type="email"
                  id="thq-sign-up-2-email1"
                  required="required"
                  placeholder="lorem@ipsum.com"
                  class=" text-input text-body-large"/>
                <label for="thq-sign-up-2-email1"></label>
              </div>
            </form>
            <button type="submit" class="button-background-filled">
              <span class=" text-body-small">Change your Profile</span>
            </button>
          </div>
          <div class="forms-divider flex-row">
            <img
              alt="image"
              src="../public/external/divider.png"
              class="divider"
            />
            <span class="heading-2">OR</span>
            <img
              alt="image"
              src="../public/external/divider.png"
              class="divider"
            />
          </div>
          <form class="flex-column">
            <span class="heading-3">Change your password</span>
            <div class="flex-column">
              <h2 data-form="thq-sign-up-2-username"
                class=" text-body-large"
              >
                Old password
              </h2>
              <input
                type="text"
                id="thq-sign-up-2-username2"
                required="required"
                placeholder="Mr. Lorem Ipsum"
                class="text-input text-body-large"/>
              <label for="thq-sign-up-2-username2"></label>
            </div>
            <div class="flex-column">
              <h2 data-form="thq-sign-up-2-email"
                class=" text-body-large"
              >
                New password
              </h2>
              <input
                type="email"
                id="thq-sign-up-2-email2"
                required="required"
                placeholder="lorem@ipsum.com"
              class=" text-input text-body-large"/>
              <label for="thq-sign-up-2-email2"></label>
            </div>
            <button type="submit" class="button-background-filled">
              <span class=" text-body-small">Change your Password</span>
            </button>
          </form>
        </div>
      </div>
    </div>

    <footer id="footer" xlu-include-file="../footer/footer.html">
    </footer>

    <div xlu-include-file="../script-load-component/script.html"></div>

    <script>

      xLuIncludeFile();

    </script>

  </body>
</html>
