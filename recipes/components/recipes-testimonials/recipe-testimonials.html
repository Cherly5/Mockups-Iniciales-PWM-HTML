<div class="section-padding">
  <h1 id="testimonials-title" class="recipes-testimonials-text-inline"></h1>
  <div class="recipes-testimonials-max-width section-max-width">
    <div data-thq="slider" data-loop="true" data-autoplay="true"
         data-navigation="true" data-pagination="true"
         class="recipes-testimonials-slider swiper">
      <div data-thq="slider-wrapper" class="swiper-wrapper">
        <template id="slide">
          <div data-thq="slider-slide" class="recipes-testimonials-slide swiper-slide">
            <div class="recipes-testimonials-slide-container">
              <img
                      alt=""
                      src=""
                      class="recipes-testimonials-thumbnail img-ratio-1-1"
              />
              <div class="recipes-testimonials-content">
                <div class="recipes-testimonials-stars"><!-- stars valuation --></div>
                <p class="text-body-large recipes-testimonials-text recipes-testimonials-text-inline"></p>
                <div class="recipes-testimonials-avatar">
                  <div class="recipes-testimonials-avatar-content">
                    <span class="recipes-testimonials-text text-body-small recipes-testimonials-text-inline"></span>
                    <span class="text-body-small recipes-testimonials-text-inline"></span>
                  </div>
                  <img alt="" src="" class="recipes-testimonials-logo"/>
                </div>
              </div>
            </div>
          </div>
        </template>
        <template id="star-icon">
          <svg viewBox="0 0 1024 1024" class="icon-small">
            <path d="M512 736l-264 160 70-300-232-202 306-26 120-282 120 282 306 26-232 202 70 300z"></path>
          </svg>
        </template>
      </div>
      <div data-thq="slider-pagination" class="recipes-testimonials-slider-pagination swiper-pagination swiper-pagination-bullets swiper-pagination-horizontal">
        <div data-thq="slider-pagination-bullet" class="swiper-pagination-bullet swiper-pagination-bullet-active"></div>
        <div data-thq="slider-pagination-bullet" class="swiper-pagination-bullet"></div>
        <div data-thq="slider-pagination-bullet" class="swiper-pagination-bullet"></div>
      </div>
      <div data-thq="slider-button-prev" class="swiper-button-prev"></div>
      <div data-thq="slider-button-next" class="swiper-button-next"></div>
    </div>
  </div>
</div>
<link rel="stylesheet" href="/recipes/components/recipes-testimonials/recipe-testimonials.css"/>
<a rel="json" href="/recipes/recipes.json"></a>
<script src="/recipes/components/recipes-testimonials/testimonials.js"></script>
