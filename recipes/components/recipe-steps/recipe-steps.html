<div class="section-padding">
    <div class="recipe-steps-max-width section-max-width">
        <div class="recipe-steps-container-section">
            <span id="recipe-steps-title" class="recipe-steps-title heading-2 recipe-steps-text"></span>
        </div>
        <div class="recipe-steps-timeline-container">
            <div id="recipe-ingredients" class="recipe-steps-step">
                <div class="recipe-steps-separator">
                    <div class="recipe-steps-separator-point"></div>
                    <div class="recipe-steps-separator-bar"></div>
                </div>
                <div class="recipe-steps-step-content">
                    <span class="heading-3 recipe-steps-text">Ingredients</span>
                    <ul class="recipe-steps-ul list">
                        <!-- .list-item -->
                        <template>
                            <li class="list-item">
                                <span class="recipe-steps-text recipe-steps-ingredient"></span>
                            </li>
                        </template>
                    </ul>
                </div>
            </div>
            <template id="recipe-step-template">
                <div class="recipe-steps-step">
                    <div class="recipe-steps-separator">
                        <div class="recipe-steps-separator-point"></div>
                        <div class="recipe-steps-separator-bar"></div>
                    </div>
                    <div class="recipe-steps-step-content">
                        <span class="heading-3 recipe-steps-text"></span>
                        <span class="text-body-small recipe-steps-text"></span>
                    </div>
                </div>
            </template>
        </div>
        <div class="recipe-steps-container-section">
            <div class="recipe-steps-container25">
                <h2 class="recipe-steps-title heading-2 recipe-steps-text">Rate this recipe!</h2>
                <div class="star-rating-wrapper">
                    <!--StarRating component-->
                    <div class="rectangle">
                        <div class="star-rating">
                            <span class="star" data-value="1">★</span>
                            <span class="star" data-value="2">★</span>
                            <span class="star" data-value="3">★</span>
                            <span class="star" data-value="4">★</span>
                            <span class="star" data-value="5">★</span>
                        </div>
                        <script src="/recipes/components/star-rating-component/starRating.js"></script>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<link rel="stylesheet" href="/recipes/components/recipe-steps/recipe-steps.css"/>
<link rel="stylesheet" href="/recipes/components/star-rating-component/starRating.css"/>
<a rel="json" href="/recipes/recipe-page.json"></a>
<script src="/recipes/components/recipe-steps/recipe-steps.js"></script>
