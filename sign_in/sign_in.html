                    </div>
                  </div>
                  <input
                    type="password"
                    id="thq-sign-in-1-password"
                    required="required"
                    placeholder="Password"
                    class="sign-in-textinput2 thq-input thq-body-large"
                  />
                </div>
              </form>
              <div class="sign-in-container4">
                <div class="sign-in-container5">
                  <button
                    type="submit"
                    class="sign-in-button1 thq-button-filled"
                    onclick="signIn()"
                  >
                    <!--<a href="#" id="link-sign-in2" class="sign-in-text20"></a>-->
                    <span class="sign-in-text14 thq-body-small">
                      <fragment class="sign-in-fragment4">
                        <span class="sign-in-text20">Sign In</span>
                      </fragment>
                    </span>

              </div>
            </div>
          </div>
          <div class="sign-in-container7">
            <div class="sign-in-divider1">
              <div class="sign-in-divider2"></div>
              <span class="thq-body-large">
                <fragment class="sign-in-fragment3">
                  <span class="sign-in-text19">
                    You don't have an Account yet? Sign Up now to get full
                    access!&nbsp;
                  </span>
                </fragment>
              </span>
              <div class="sign-in-divider3"></div>
            </div>
            <button type="button" class="sign-in-button2 thq-button-outline">
              <span class="sign-in-text16 thq-body-small">
                <fragment class="sign-in-fragment1">
                  <span class="sign-in-text17">Sign Up</span>
                </fragment>
              </span>
