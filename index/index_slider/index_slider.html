<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Mockups Iniciales PWM</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta charset="utf-8" />
    <meta property="twitter:card" content="summary_large_image" />

    <link rel="stylesheet" data-tag="reset-style-sheet" href="../../stylesheets/reset-style-sheet.css"  />
    <link rel="stylesheet" data-tag="default-style-sheet" href="../../stylesheets/default-style-sheet.css" />>
    <link rel="stylesheet" href="../../stylesheets/animate-sheet.css"/>
    <link rel="stylesheet" href="../../stylesheets/noto-sans-font.css" data-tag="font"/>

  </head>
  <body>
    <div>
      <link href="index_slider.css" rel="stylesheet" />
      <div class="index_slider-gallery3 thq-section-padding">
        <div class="index_slider-max-width thq-section-max-width">
          <div class="index_slider-section-title">
            <h2 class="index_slider-text1 thq-heading-2">
              <fragment class="index_slider-fragment1">
                <span class="index_slider-text3">
                  Explore Our Culinary Creations
                </span>
              </fragment>
            </h2>
            <span class="index_slider-text2 thq-body-large">
              <fragment class="index_slider-fragment2">
                <span class="index_slider-text4">
                  Browse through a selection of our visually stunning and
                  delectable dishes that are sure to tantalize your taste buds.
                </span>
              </fragment>
            </span>
          </div>
          <div class="index_slider-container1">
            <div class="index_slider-content">
              <div
                data-thq="slider"
                data-navigation="true"
                data-pagination="true"
                class="index_slider-slider swiper"
              >
                <div
                  data-thq="slider-wrapper"
                  class="index_slider-slider-wrapper swiper-wrapper"
                >
                  <div
                    data-thq="slider-slide"
                    class="index_slider-slider-slide1 swiper-slide"
                  >
                    <div class="index_slider-container2">
                      <img
                        alt="Delicious Pasta Dish"
                        src="https://images.unsplash.com/photo-1430931071372-38127bd472b8?crop=entropy&amp;cs=tinysrgb&amp;fit=max&amp;fm=jpg&amp;ixid=M3w5MTMyMXwwfDF8cmFuZG9tfHx8fHx8fHx8MTczODg3ODE1OXw&amp;ixlib=rb-4.0.3&amp;q=80&amp;w=1080"
                        class="index_slider-image1 thq-img-ratio-4-3"
                      />

                    <div class="index_slider-container3">
                      <img
                        alt="Mouthwatering Chocolate Cake"
                        src="https://images.unsplash.com/photo-1708388464516-b52bfefde2b0?crop=entropy&amp;cs=tinysrgb&amp;fit=max&amp;fm=jpg&amp;ixid=M3w5MTMyMXwwfDF8cmFuZG9tfHx8fHx8fHx8MTczODg3ODU1OXw&amp;ixlib=rb-4.0.3&amp;q=80&amp;w=1080"
                        class="index_slider-image2 thq-img-ratio-4-3"
                      />
                    </div>
                  </div>
                  <div
                    data-thq="slider-slide"
                    class="index_slider-slider-slide2 swiper-slide"

                    <div class="index_slider-container4">

                        src="https://images.unsplash.com/photo-1724795612879-a8942152b22d?crop=entropy&amp;cs=tinysrgb&amp;fit=max&amp;fm=jpg&amp;ixid=M3w5MTMyMXwwfDF8cmFuZG9tfHx8fHx8fHx8MTczODg3ODE1OXw&amp;ixlib=rb-4.0.3&amp;q=80&amp;w=1080"
                        class="index_slider-image3 thq-img-ratio-4-3"
                      />
                    </div>
                    <div class="index_slider-container5">
                      <img
                        alt="Refreshing Fruit Salad"
                        src="https://images.unsplash.com/photo-1654723011662-e9be9ab3fe84?crop=entropy&amp;cs=tinysrgb&amp;fit=max&amp;fm=jpg&amp;ixid=M3w5MTMyMXwwfDF8cmFuZG9tfHx8fHx8fHx8MTczODg3ODE1OHw&amp;ixlib=rb-4.0.3&amp;q=80&amp;w=1080"

                    class="index_slider-slider-slide3 swiper-slide"

                        class="index_slider-image5 thq-img-ratio-4-3"

                    </div>

                <div

                ></div>

                  class="index_slider-slider-pagination swiper-pagination swiper-pagination-bullets swiper-pagination-horizontal"
                >
                  <div
                    data-thq="slider-pagination-bullet"
                    class="swiper-pagination-bullet swiper-pagination-bullet-active"
                  ></div>
                  <div
                    data-thq="slider-pagination-bullet"
                    class="swiper-pagination-bullet"
                  ></div>
